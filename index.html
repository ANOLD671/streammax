<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>StreamMax Telegram IPTV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root {
    --bg: #0e0e0e;
    --card: #1a1a1a;
    --accent: #00c3ff;
}

body {
    margin: 0;
    background: var(--bg);
    color: white;
    font-family: Arial, sans-serif;
}

/* Top Bar */
#topBar {
    padding: 10px;
    background: #111;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

input, select {
    padding: 12px;
    background: var(--card);
    border: none;
    color: white;
    border-radius: 10px;
    font-size: 18px;
}

/* Tabs */
#tabs {
    display: flex;
    gap: 10px;
}

.tab {
    padding: 10px 15px;
    background: var(--card);
    border-radius: 25px;
    cursor: pointer;
    font-size: 18px;
}

.tab.active {
    background: var(--accent);
    color: black;
}

/* Channel List */
#channelList {
    height: 45vh;
    overflow-y: auto;
    padding: 10px;
}

.channel {
    padding: 18px;
    background: var(--card);
    margin-bottom: 10px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 22px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.channel:hover {
    background: #2a2a2a;
}

/* Plus button */
.plusBtn {
    background: var(--accent);
    border: none;
    color: black;
    padding: 5px 10px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 18px;
}

/* Fullscreen Button */
#fullscreenBtn {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    background: var(--accent);
    border: none;
    color: black;
    font-weight: bold;
    margin-bottom: 5px;
    cursor: pointer;
}

/* Message */
#message {
    text-align: center;
    padding: 10px;
    font-size: 18px;
}

/* Video */
video {
    width: 100%;
    height: 40vh;
    background: black;
    border-radius: 10px;
}
</style>
</head>

<body>

<div id="topBar">
    <input type="text" id="searchInput" placeholder="Search channel...">
    <select id="countryFilter">
        <option value="all">All Countries</option>
    </select>
    <div id="tabs">
        <div class="tab active" data-type="all">All</div>
        <div class="tab" data-type="favorites">Favorites</div>
    </div>
</div>

<div id="channelList">Loading channels...</div>
<button id="fullscreenBtn">FULL SCREEN</button>
<div id="message"></div>
<video id="video" controls autoplay playsinline webkit-playsinline></video>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const M3U_URL = "https://iptv-org.github.io/iptv/index.m3u";

const channelListDiv = document.getElementById("channelList");
const video = document.getElementById("video");
const searchInput = document.getElementById("searchInput");
const countryFilter = document.getElementById("countryFilter");
const message = document.getElementById("message");

let allChannels = [];
let currentTab = "all";
let hls = null;
let renderIndex = 0;
const RENDER_BATCH = 50;

/* LOAD CHANNELS */
async function loadChannels() {
    try {
        const response = await fetch(M3U_URL);
        const text = await response.text();
        allChannels = parseM3U(text);
        populateCountries();
        displayChannels();
    } catch {
        channelListDiv.innerHTML = "Failed to load channels.";
    }
}

/* PARSE M3U */
function parseM3U(content) {
    const lines = content.split("\n");
    const channels = [];

    for (let i = 0; i < lines.length; i++) {
        if (lines[i].startsWith("#EXTINF")) {
            const name = lines[i].split(",").pop().trim();
            const url = lines[i + 1]?.trim();
            const countryMatch = lines[i].match(/tvg-country="(.*?)"/);
            const country = countryMatch ? countryMatch[1] : "Unknown";
            if (url && url.startsWith("http")) {
                channels.push({ name, url, country });
            }
        }
    }
    return channels;
}

/* FAVORITES STORAGE */
function getFavorites() { return JSON.parse(localStorage.getItem("favorites") || "[]"); }
function toggleFavorite(url) {
    let favs = getFavorites();
    if (favs.includes(url)) favs = favs.filter(f => f !== url);
    else favs.push(url);
    localStorage.setItem("favorites", JSON.stringify(favs));
}

/* FILTERED CHANNELS */
function getFilteredChannels() {
    return allChannels.filter(ch => {
        if (currentTab === "favorites" && !getFavorites().includes(ch.url)) return false;
        if (countryFilter.value !== "all" && ch.country !== countryFilter.value) return false;
        if (!ch.name.toLowerCase().includes(searchInput.value.toLowerCase())) return false;
        return true;
    });
}

/* RENDER CHANNELS WITH PLUS BUTTON */
function displayChannels() {
    channelListDiv.innerHTML = "";
    renderIndex = 0;
    renderBatch(getFilteredChannels());
}

function renderBatch(filtered) {
    const end = renderIndex + RENDER_BATCH;
    const favs = getFavorites();

    for (let i = renderIndex; i < end && i < filtered.length; i++) {
        const ch = filtered[i];

        const div = document.createElement("div");
        div.className = "channel";

        // Channel name
        const spanName = document.createElement("span");
        spanName.textContent = ch.name;
        if (favs.includes(ch.url)) spanName.style.color = "#00c3ff";
        div.appendChild(spanName);

        // Plus button
        if (!favs.includes(ch.url)) {
            const plus = document.createElement("button");
            plus.className = "plusBtn";
            plus.textContent = "+";
            plus.onclick = (e) => {
                e.stopPropagation();
                toggleFavorite(ch.url);
                displayChannels();
            };
            div.appendChild(plus);
        }

        div.onclick = () => playStream(ch.url);

        /* LONG PRESS MOBILE */
        let pressTimer;
        div.ontouchstart = () => {
            pressTimer = setTimeout(() => {
                toggleFavorite(ch.url);
                displayChannels();
            }, 600);
        };
        div.ontouchend = () => clearTimeout(pressTimer);

        channelListDiv.appendChild(div);
    }

    renderIndex = end;
    if (renderIndex < filtered.length) {
        requestAnimationFrame(() => renderBatch(filtered));
    }
}

/* PLAY STREAM FAST + ERROR HANDLING */
function playStream(url) {
    message.innerHTML = "Please wait... Loading stream";
    if (hls) { hls.destroy(); hls = null; }

    const isNativeHls = video.canPlayType('application/vnd.apple.mpegurl');

    if (Hls.isSupported() && !isNativeHls) {
        hls = new Hls({ maxBufferLength: 5, enableWorker: true, lowLatencyMode: true });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { message.innerHTML = ""; video.play().catch(()=>{}); });
        hls.on(Hls.Events.ERROR, () => { message.innerHTML = "⚠️ Error: Stream failed to broadcast."; });
    } else if (isNativeHls) {
        video.src = url;
        video.onloadedmetadata = () => { message.innerHTML = ""; video.play().catch(()=>{}); };
        video.onerror = () => message.innerHTML = "⚠️ Error: Stream failed.";
    } else {
        video.src = url;
        video.onloadeddata = () => message.innerHTML = "";
        video.onerror = () => message.innerHTML = "⚠️ Error: Stream failed.";
    }
}

/* COUNTRIES */
function populateCountries() {
    const countries = [...new Set(allChannels.map(ch => ch.country))];
    countries.sort().forEach(c => {
        const option = document.createElement("option");
        option.value = c;
        option.textContent = c;
        countryFilter.appendChild(option);
    });
}

/* FULLSCREEN BUTTON */
document.getElementById("fullscreenBtn").onclick = () => {
    if (video.requestFullscreen) video.requestFullscreen();
    else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
};

/* EVENTS */
searchInput.oninput = displayChannels;
countryFilter.onchange = displayChannels;
document.querySelectorAll(".tab").forEach(tab => {
    tab.onclick = () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentTab = tab.dataset.type;
        displayChannels();
    };
});

loadChannels();
</script>
</body>
</html>
